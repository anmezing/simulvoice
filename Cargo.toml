[package]
name = "simulvoice"
version = "0.46.1"
edition = "2021"
repository = "https://github.com/anmezing/simulvoice"
license = "PolyForm-Noncommercial-1.0.0"

[features]
default = ["sherpa-static"]
sherpa-static = ["sherpa-onnx/static"]
directml = ["sherpa-onnx/shared"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
cpal = "0.15"
rodio = "0.19"
hound = "3"
ureq = { version = "2", features = ["json", "tls"] }
chrono = "0.4"
wasapi = "0.19"
libloading = "0.8"
zip = "2"
dirs = "5"
windows = { version = "0.61", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Foundation"] }
nnnoiseless = "0.5"
eframe = "0.29"
sherpa-onnx = { version = "1.13.8", default-features = false }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }
tokenizers = "0.22"
realfft = "3"
wsola = "0.2"
aec-rs = "1.0"
tar = "0.4"
bzip2 = "0.4"
rubato = "0.15"
ctrlc = "3"
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Diagnostics_ToolHelp"] }
raw-window-handle = "0.6"
fs2 = "0.4"

[profile.release]
# 行号级调试信息只进 simulvoice.pdb，不增大 exe；崩溃 dump 靠它定位到源码行
debug = "line-tables-only"
lto = "thin"
strip = true
codegen-units = 1

[patch.crates-io]
# speexdsp 改用 smallft，避免与 sherpa-onnx 的 kissfft 同名函数冲突（见 third_party/aec-rs-sys/speexdsp/CMakeLists.txt）
aec-rs-sys = { path = "third_party/aec-rs-sys" }
